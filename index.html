<style>
  :root {
    --ink: #07131f;
    --navy: #0b1f33;
    --navy-2: #12314d;
    --teal: #0f6b5c;
    --gold: #d8b45a;
    --gold-2: #c39a3a;
    --paper: #f7f4ee;
    --muted: rgba(255, 255, 255, 0.62);
    --line: rgba(255, 255, 255, 0.14);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: clamp(16px, 5vw, 40px);
    color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial,
      "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
    background:
      radial-gradient(1100px 760px at 12% -10%, rgba(23, 63, 99, 0.95) 0%, transparent 62%),
      radial-gradient(900px 700px at 108% 112%, rgba(14, 90, 80, 0.9) 0%, transparent 58%),
      linear-gradient(160deg, #081726 0%, #06111c 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(circle at 50% 35%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 35%, #000 0%, transparent 78%);
  }

  .card {
    position: relative;
    margin: auto;
    width: 100%;
    max-width: 470px;
    padding: clamp(28px, 6vw, 44px) clamp(20px, 5vw, 36px) clamp(22px, 5vw, 30px);
    border: 1px solid var(--line);
    border-radius: 30px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035));
    box-shadow:
      0 40px 90px -30px rgba(0, 0, 0, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: clamp(24px, 5vw, 32px);
  }

  .logo-tile {
    display: grid;
    place-items: center;
    padding: 10px 12px;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 20px 44px -24px rgba(0, 0, 0, 0.85);
  }

  .logo-tile img {
    display: block;
    width: clamp(78px, 20vw, 96px);
    height: auto;
  }

  .tagline {
    margin: 0;
    text-align: center;
    font-size: clamp(17px, 4.2vw, 20px);
    font-weight: 700;
    line-height: 1.55;
    color: #ffffff;
  }

  .tagline-en {
    margin: 0;
    text-align: center;
    font-size: clamp(13px, 3.4vw, 15px);
    line-height: 1.6;
    color: var(--muted);
  }

  .options {
    display: grid;
    gap: 14px;
  }

  .option {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 82px;
    padding: 16px 20px;
    border-radius: 18px;
    text-decoration: none;
    color: var(--navy);
    background: var(--paper);
    border: 1px solid rgba(255, 255, 255, 0.65);
    box-shadow: 0 16px 34px -18px rgba(0, 0, 0, 0.75);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .option:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 44px -18px rgba(0, 0, 0, 0.85);
    filter: brightness(1.02);
  }

  .option:active { transform: translateY(0) scale(0.995); }

  .option:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
  }

  .option .badge {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 13px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #fff;
    background: linear-gradient(145deg, var(--navy-2), var(--navy));
  }

  .option .text {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    flex: 1;
  }

  .option .text strong {
    font-size: 20px;
    font-weight: 750;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  .option .text small {
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(7, 19, 31, 0.62);
  }

  .option .arrow {
    flex: 0 0 auto;
    font-size: 22px;
    line-height: 1;
    color: rgba(7, 19, 31, 0.45);
    transition: transform 0.18s ease;
  }

  .option:hover .arrow { transform: translateX(3px); }

  .option.ar {
    color: #1c1404;
    background: linear-gradient(145deg, #e8c56a 0%, #d3a845 55%, #c39a3a 100%);
    border-color: rgba(255, 240, 200, 0.6);
    font-family: "Segoe UI", "Noto Sans Arabic", "Geeza Pro", Tahoma, Arial, sans-serif;
  }

  .option.ar .badge {
    color: #1c1404;
    background: rgba(28, 20, 4, 0.1);
    border: 1px solid rgba(28, 20, 4, 0.16);
    font-size: 18px;
    letter-spacing: 0;
  }

  .option.ar .text small { color: rgba(28, 20, 4, 0.62); }
  .option.ar .arrow { color: rgba(28, 20, 4, 0.5); }
  .option.ar:hover .arrow { transform: translateX(-3px); }

  .option.ar .text { align-items: flex-start; text-align: right; }
  .option.ar { flex-direction: row; }

  .hint {
    margin: 20px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.42);
  }

  .hint .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--gold); opacity: 0.8; }

  @media (max-width: 380px) {
    .option { min-height: 74px; padding: 13px 16px; gap: 13px; }
    .option .badge { width: 42px; height: 42px; }
    .option .text strong { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .option, .arrow { animation: none !important; transition: none !important; }
  }
</style>
